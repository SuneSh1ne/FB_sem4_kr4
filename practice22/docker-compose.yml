version: "3.8"

services:
  # ============================================
  # Backend сервер 1 (основной)
  # ============================================
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend1
    environment:
      - PORT=3000
      - SERVER_ID=1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Ограничение ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Backend сервер 2 (основной)
  # ============================================
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend2
    environment:
      - PORT=3000
      - SERVER_ID=2
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Backend сервер 3 (резервный)
  # ============================================
  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend3
    environment:
      - PORT=3000
      - SERVER_ID=3
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Nginx балансировщик
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx-balancer
    ports:
      - "80:80"      # Основной порт с health checks
      - "8001:8001"  # Round Robin
      - "8002:8002"  # Least Connections
      - "8003:8003"  # IP Hash
    volumes:
      # Монтируем конфигурацию Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
    name: load-balancer-network