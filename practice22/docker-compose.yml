version: "3.8"

services:
  # Backend сервер 1
  backend1:
    build:
      context: ./backend
    container_name: backend1
    environment:
      - PORT=3000
      - SERVER_NAME=Backend-1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Backend сервер 2
  backend2:
    build:
      context: ./backend
    container_name: backend2
    environment:
      - PORT=3000
      - SERVER_NAME=Backend-2
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Backend сервер 3 (резервный)
  backend3:
    build:
      context: ./backend
    container_name: backend3
    environment:
      - PORT=3000
      - SERVER_NAME=Backend-3 (Backup)
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx как балансировщик
  nginx:
    image: nginx:alpine
    container_name: nginx-balancer
    ports:
      - "80:80"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # HAProxy как альтернативный балансировщик
  haproxy:
    image: haproxy:alpine
    container_name: haproxy-balancer
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - app-network
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge