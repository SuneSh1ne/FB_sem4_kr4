events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status to: $upstream_addr';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Upstream с health checks (для порта 80)
    upstream backend_main {
        server backend1:3000 max_fails=2 fail_timeout=30s;
        server backend2:3000 max_fails=2 fail_timeout=30s;
        server backend3:3000 backup;
    }

    # Round Robin (для порта 8001)
    upstream backend_rr {
        server backend1:3000;
        server backend2:3000;
    }

    # Least Connections (для порта 8002)
    upstream backend_lc {
        least_conn;
        server backend1:3000;
        server backend2:3000;
    }

    # IP Hash (для порта 8003)
    upstream backend_ip {
        ip_hash;
        server backend1:3000;
        server backend2:3000;
    }

    # Порт 80 - Health Checks
    server {
        listen 80;
        
        location /nginx-health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
        
        location / {
            proxy_pass http://backend_main;
            proxy_set_header Host $host;
            add_header X-Server $upstream_addr always;
        }
    }

    # Порт 8001 - Round Robin
    server {
        listen 8001;
        
        location / {
            proxy_pass http://backend_rr;
            proxy_set_header Host $host;
            add_header X-Server $upstream_addr always;
        }
    }

    # Порт 8002 - Least Connections
    server {
        listen 8002;
        
        location / {
            proxy_pass http://backend_lc;
            proxy_set_header Host $host;
            add_header X-Server $upstream_addr always;
        }
    }

    # Порт 8003 - IP Hash
    server {
        listen 8003;
        
        location / {
            proxy_pass http://backend_ip;
            proxy_set_header Host $host;
            add_header X-Server $upstream_addr always;
        }
    }
}