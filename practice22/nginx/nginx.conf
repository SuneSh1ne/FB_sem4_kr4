# Количество рабочих процессов
worker_processes auto;

events {
    # Максимальное количество соединений на рабочий процесс
    worker_connections 1024;
    # Метод обработки соединений
    use epoll;
}

http {
    # Основные настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логов с информацией о backend-сервере
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'to: $upstream_addr ($upstream_response_time)';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1m;

    # Таймауты для проксирования
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # ============================================
    # Upstream блок для backend-серверов
    # ============================================
    upstream backend_servers {
        # Алгоритм Round Robin (по умолчанию)
        # server backend1:3000 weight=2 max_fails=3 fail_timeout=30s;
        # server backend2:3000 weight=1 max_fails=3 fail_timeout=30s;
        # server backend3:3000 weight=1 backup max_fails=2 fail_timeout=60s;

        # Базовая балансировка
        server backend1:3000;
        server backend2:3000;
        server backend3:3000 backup; # Резервный сервер
    }

    # ============================================
    # Upstream с настройками отказоустойчивости
    # ============================================
    upstream backend_with_health_check {
        # Параметры отказоустойчивости:
        # max_fails - максимальное количество неудачных попыток
        # fail_timeout - время исключения сервера из балансировки
        
        server backend1:3000 weight=2 max_fails=3 fail_timeout=30s;
        server backend2:3000 weight=1 max_fails=3 fail_timeout=30s;
        server backend3:3000 weight=1 backup max_fails=2 fail_timeout=60s;
    }

    # ============================================
    # Основной сервер (порт 80)
    # ============================================
    server {
        listen 80;
        server_name localhost;
        server_tokens off; # Скрываем версию Nginx

        # Основной маршрут с балансировкой и health checks
        location / {
            proxy_pass http://backend_with_health_check;

            # Прокси-заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Добавляем заголовки с информацией о backend
            add_header X-Backend-Server $upstream_addr always;
            add_header X-Response-Time $request_time always;

            # Буферизация ответов
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Health check для Nginx
        location /nginx-health {
            access_log off;
            return 200 "Nginx is healthy\n";
            add_header Content-Type text/plain;
        }

        # Статистика Nginx (только для localhost)
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }

        # Статические файлы (если нужны)
        location /static {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # Дополнительные порты для разных алгоритмов
    # ============================================

    # Порт 8001 - Round Robin без health checks
    server {
        listen 8001;
        server_name localhost;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Backend-Server $upstream_addr always;
        }
    }

    # Порт 8002 - Least Connections
    upstream backend_least_conn {
        least_conn;
        server backend1:3000;
        server backend2:3000;
        server backend3:3000 backup;
    }

    server {
        listen 8002;
        server_name localhost;

        location / {
            proxy_pass http://backend_least_conn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Algorithm "Least Connections";
            add_header X-Backend-Server $upstream_addr always;
        }
    }

    # Порт 8003 - IP Hash (sticky sessions)
    upstream backend_ip_hash {
        ip_hash;
        server backend1:3000;
        server backend2:3000;
        server backend3:3000 backup;
    }

    server {
        listen 8003;
        server_name localhost;

        location / {
            proxy_pass http://backend_ip_hash;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Algorithm "IP Hash";
            add_header X-Backend-Server $upstream_addr always;
        }
    }
}