# Количество рабочих процессов
worker_processes auto;

events {
    # Максимальное количество соединений на один рабочий процесс
    worker_connections 1024;
    # Метод обработки соединений
    use epoll;
}

http {
    # Основные настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логов
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'to: $upstream_addr';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Таймауты
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # ============================================
    # Базовая балансировка (Round Robin)
    # ============================================
    upstream backend_round_robin {
        # Алгоритм Round Robin используется по умолчанию
        server backend1:3000 weight=1;
        server backend2:3000 weight=1;
        server backend3:3000 weight=1 backup;  # Резервный сервер
    }

    # ============================================
    # Балансировка с Least Connections
    # ============================================
    upstream backend_least_conn {
        least_conn;
        server backend1:3000 weight=1;
        server backend2:3000 weight=1;
        server backend3:3000 weight=1 backup;
    }

    # ============================================
    # Балансировка с IP Hash
    # ============================================
    upstream backend_ip_hash {
        ip_hash;
        server backend1:3000 weight=1;
        server backend2:3000 weight=1;
        server backend3:3000 weight=1 backup;
    }

    # ============================================
    # Балансировка с Health Checks
    # ============================================
    upstream backend_with_health_check {
        # Использование health checks
        server backend1:3000 weight=2 max_fails=3 fail_timeout=30s;
        server backend2:3000 weight=1 max_fails=3 fail_timeout=30s;
        server backend3:3000 weight=1 backup max_fails=2 fail_timeout=60s;
    }

    # ============================================
    # Основной сервер (Round Robin с Health Checks)
    # ============================================
    server {
        listen 80;
        server_name localhost;

        # Проксирование всех запросов к backend
        location / {
            proxy_pass http://backend_with_health_check;
            
            # Прокси-заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Добавляем заголовок с сервером, обработавшим запрос
            add_header X-Backend-Server $upstream_addr always;
            add_header X-Response-Time $request_time always;
        }

        # Отдельный маршрут для health check
        location /nginx-health {
            access_log off;
            return 200 "Nginx is healthy\n";
            add_header Content-Type text/plain;
        }

        # Статистика Nginx
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }

    # ============================================
    # Сервер с Round Robin
    # ============================================
    server {
        listen 8001;
        server_name localhost;

        location / {
            proxy_pass http://backend_round_robin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Backend-Server $upstream_addr always;
        }
    }

    # ============================================
    # Сервер с Least Connections
    # ============================================
    server {
        listen 8002;
        server_name localhost;

        location / {
            proxy_pass http://backend_least_conn;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Backend-Server $upstream_addr always;
        }
    }

    # ============================================
    # Сервер с IP Hash
    # ============================================
    server {
        listen 8003;
        server_name localhost;

        location / {
            proxy_pass http://backend_ip_hash;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Backend-Server $upstream_addr always;
        }
    }
}