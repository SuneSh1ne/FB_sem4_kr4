# Глобальные настройки
global
    log 127.0.0.1 local0
    log 127.0.0.1 local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon
    # Оптимизация производительности
    nbproc 2
    cpu-map 1 0
    cpu-map 2 1

# Настройки по умолчанию
defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor
    option redispatch
    
    # Таймауты
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    
    # Health checks
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost
    
    # Статистика
    stats enable
    stats uri /haproxy-stats
    stats realm HAProxy\ Statistics
    stats auth admin:admin123
    stats refresh 10s
    stats show-node

# ============================================
# Frontend для приема входящих соединений
# ============================================
frontend http_front
    bind *:8080
    default_backend app_backend
    
    # Логирование
    capture request header Host len 64
    capture request header User-Agent len 128
    capture request header Content-Type len 64

# ============================================
# Backend с Round Robin балансировкой
# ============================================
backend app_backend
    # Алгоритм балансировки
    balance roundrobin
    
    # Опции
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    
    # Серверы приложения
    server backend1 backend1:3000 check inter 5s rise 2 fall 3 weight 2
    server backend2 backend2:3000 check inter 5s rise 2 fall 3 weight 1
    server backend3 backend3:3000 check inter 5s rise 2 fall 3 weight 1 backup
    
    # Включение sticky sessions (опционально)
    # cookie SERVERID insert indirect nocache

# ============================================
# Backend с Least Connections
# ============================================
backend app_backend_leastconn
    balance leastconn
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    
    server backend1 backend1:3000 check inter 5s
    server backend2 backend2:3000 check inter 5s
    server backend3 backend3:3000 check inter 5s backup

# Frontend для Least Connections (порт 8081)
frontend http_front_leastconn
    bind *:8081
    default_backend app_backend_leastconn

# ============================================
# Backend с Source IP Hash (sticky sessions)
# ============================================
backend app_backend_source
    balance source
    hash-type consistent
    option httpchk GET /api/health HTTP/1.1\r\nHost:\ localhost
    http-check expect status 200
    
    server backend1 backend1:3000 check inter 5s
    server backend2 backend2:3000 check inter 5s
    server backend3 backend3:3000 check inter 5s backup

# Frontend для Source IP Hash (порт 8082)
frontend http_front_source
    bind *:8082
    default_backend app_backend_source

# ============================================
# Статистика HAProxy
# ============================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats realm HAProxy\ Statistics
    stats auth admin:admin123
    stats refresh 5s
    stats admin if TRUE